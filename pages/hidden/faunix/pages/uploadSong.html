                    <script>
                        // custom file handler
                        document.getElementById('fileInput').addEventListener('change', function (e) {
                            const fileName = e.target.files[0]?.name || 'No file chosen';
                            document.getElementById('fileName').textContent = fileName;
                        });


                        // All that biz for handling the drop zone:

                        const dropZone = document.getElementById('dropZone');
                        // const fileInput = document.getElementById('fileInput');

                        // Prevent default drag behaviors
                        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                            dropZone.addEventListener(eventName, preventDefaults, false);
                            document.body.addEventListener(eventName, preventDefaults, false);
                        });

                        function preventDefaults(e) {
                            e.preventDefault();
                            e.stopPropagation();
                        }

                        // Highlight drop zone when dragging over it
                        ['dragenter', 'dragover'].forEach(eventName => {
                            dropZone.addEventListener(eventName, () => {
                                dropZone.classList.add('drag-over');
                            });
                        });

                        ['dragleave', 'drop'].forEach(eventName => {
                            dropZone.addEventListener(eventName, () => {
                                dropZone.classList.remove('drag-over');
                            });
                        });

                        // Handle dropped files
                        dropZone.addEventListener('drop', (e) => {
                            const files = e.dataTransfer.files;
                            filesAdded(files);
                        });

                        // Also handle regular file input
                        fileInput.addEventListener('change', (e) => {
                            filesAdded(e.target.files);
                        });


                        let defaultSong;
                        let defaultVersionName;
                        let filesFromDropZone = [];
                        function filesAdded(files) {
                            filesFromDropZone = files;
                            // console.log(files.length);
                            try {
                                document.getElementById('chosenfiletext').textContent = '';
                            } catch (error) {
                                console.log("Chose file through input form, caught error:");
                                console.log(error);
                            }
                            const fa = document.getElementById('files_added');

                            fa.textContent = "Selected " + files[0].name;
                            fa.style = "color: rgb(255, 255, 0)";
                            if (files.length > 0) {
                                const file = files[0];
                                console.log('File selected:', file.name);
                                // Do something with the file
                                // determine defaultSong by checking the filename for keywords and matching to existing songs
                                // just learned about regex and the /pattern/ type... going to use a regex string (regular expression)
                                // split all your songnames by regex string
                                // look for highest match score
                                // assign that as the song you pick
                                // display all the remaining words in the "version name"
                                const filename = file.name;
                                const songNames = getSongNames();
                                const regex = /[ .,]/;
                                const filesplit = (filename.toLowerCase()).split(regex);
                                // console.log(filesplit);

                                // 'b' is each successive one through the rotation
                                const songGuess = songNames.reduce((a, b) => {


                                    const alist = a.toLowerCase().split(regex);
                                    const blist = b.toLowerCase().split(regex);
                                    // console.log(`alist: ${alist}`);
                                    // console.log(`blist: ${blist}`);

                                    // the 'score' returns something curious:
                                    //      basically, if two words match between the wordLists, then we increase score
                                    //      by the number of letters in the word.
                                    //      so score is like... the number of letters in matching words between the lists.
                                    let score = (list) => {
                                        return list.reduce((score, word) => {
                                            if (filesplit.some(w => w === word)) {
                                                return score + word.length;
                                            } else {
                                                return score;
                                            }
                                        }, 0);
                                    }

                                    let ascore = score(alist);
                                    let bscore = score(blist);

                                    // console.log(`score for ${a} is ${ascore}`);
                                    // console.log(`score for ${b} is ${bscore}`);

                                    return ascore > bscore ? a : b;
                                });
                                console.log("Return from song guess:");
                                console.log(songGuess);
                                defaultSong = songGuess;

                                // Now, version name needs to be all the words of filename that aren't in songGuess
                                const filesplitcap = filename.split(regex);
                                const ignorelist = ['wav', 'mp3', 'flac', 'm4a'];
                                const delimeter = '_';
                                let vname = filesplitcap.reduce((words, word) => {
                                    if (ignorelist.includes(word) || defaultSong.includes(word)) {
                                        // ignore
                                        // console.log(`skipping ${word}`);
                                    } else {
                                        words.push(word);
                                    }
                                    return words;
                                }, []);
                                // console.log(`vname`);
                                // console.log(vname);

                                vname = vname.reduce((name, e) => {
                                    name += delimeter + e;
                                    // if (e !== vname[vname.length - 1]) name += delimeter;
                                    return name;
                                }, getName());
                                // console.log(`vname = ${vname}`);

                                defaultVersionName = vname;
                                updateSongNamePreview(vname, songGuess);

                                setHtmlElements();
                            }
                        }

                    </script>

                        function submitNewSongVersion() {

                            const songName = document.getElementById('songSelect').value;
                            const versionName = document.getElementById('version_name').value;
                            const quickLinkName = document.getElementById('quickLinkSelect').value;
                            // const embed_link = document.getElementById('embed_link').value;
                            const timestamp = new Date(Date.now()).toISOString();
                            const username = getName();
                            const userID = getUserID();
                            // let fileInput = document.getElementById('fileInput');


                            let fail = "";
                            if (songName == "") {
                                fail = "Blank song name ";
                            }
                            if (versionName == "") {
                                fail += "Blank version name ";
                            }
                            if (quickLinkName == "") {
                                fail += "Please select a Source Location ";
                            }


                            if (filesFromDropZone.length < 1) {
                                // err, no file selected
                                fail += "No file selected ";
                            } else if (filesFromDropZone.length > 1) {
                                // err, only allowed to select one file per song upload.
                                console.log("Selected more than one file, defaulting to " + filesFromDropZone[0].name);
                            }
                            if (fail !== "") console.log(fail);

                            let feedback = document.getElementById("addSongFeedback");
                            if (!(fail === "")) {
                                fail += "; Submission rejected."
                                feedback.textContent = fail;
                                feedback.style = "color: red;";
                                console.log("Failing because " + fail);
                                return false;
                            }

                            // feedback.textContent = "Submission Successful.";
                            feedback.textContent = '';
                            feedback.style = "color: green";



                            // Successful submission. One file is selected, forms are properly inputted. Proceeding.

                            const submission = {
                                timestamp: timestamp,
                                song_name: songName,
                                version_name: versionName,
                                uploader: username,
                                uploader_id: userID,
                                drive_name: quickLinkName,
                                s3_url: 'blank'
                            }

                            console.log("Submitting new song to local storage:");
                            console.log(submission);

                            // error case for 'no file selected' is defined above (in the 'let fail = ...' section).
                            let file = filesFromDropZone[0];
                            addSongToLocalStorage(submission, file);


                            setHtmlElements();
                        }
