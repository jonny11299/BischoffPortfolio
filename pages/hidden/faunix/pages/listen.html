                        // trying to pass in a function to mod the child before appending, with default behavior...
                        let giveChild = (e, childType, textContent, modChild = (c) => { }) => {
                            e.innerHTML = ''
                            const c = document.createElement(childType);
                            c.textContent = textContent;
                            modChild(c);
                            e.appendChild(c);
                        }

                        // actually completely insert a different, pre-made child into this element
                        // it's fine if it doesn't already have a child.
                        let replaceChild = (e, newChild) => {
                            e.innerHTML = '';
                            e.appendChild(newChild);
                        }


                        // sets up the player html to run a particular version
                        function syncPlayerWithSettings() {
                            const albumordername = document.getElementById('albumordername');
                            const songname = document.getElementById('songname');
                            const versionname = document.getElementById('versionname');
                            // const player = document.getElementById('player');
                            const autoplay = document.getElementById('autoplay');
                            const status = document.getElementById('status');
                            // const navlistcontainer = document.getElementById('navlistcontainer');
                            // const navlist = document.getElementById('navlist');
                            const prev = document.getElementById('prev');
                            const playpause = document.getElementById('playpause');
                            const next = document.getElementById('next');
                            // const spacing = document.getElementById('spacing');
                            const notes = document.getElementById('notes');


                            // Okay, I'm getting cool ideas here.
                            // These should use my button element from before, and clicking on each should do something.
                            // Clicking on album version should take me to a list of the song order, details about it, etc.
                            // Clicking on songname should show me all the other versions for it.
                            // clicking on version name should bring me to its location in the google drive.
                            // 
                            giveChild(status, 'h4', `status: ${settings.status}`);

                            giveChild(albumordername, 'h2', `album order name: ${settings.album_order_name}`, (c) => {
                                c.style = 'color: white';
                            });
                            giveChild(songname, 'h3', `song name: ${settings.version.song_name}`);
                            giveChild(versionname, 'h4', `version name: ${settings.version.version_name}`);


                            giveChild(prev, 'button', '<--', (c) => {
                                c.onclick = prevSong;
                            });

                            const ppt = settings.playing ? 'pause' : 'play';
                            giveChild(playpause, 'button', ppt, (c) => {
                                c.onclick = playOrPause;
                            });
                            giveChild(next, 'button', '-->', (c) => {
                                c.onclick = nextSong;
                            });


                            giveChild(notes, 'h4', 'notes section');

                        }

                        function playOrPause() {
                            const a = settings.audioComponent;

                            if (settings.playing) {
                                console.log("Paused");
                                settings.playing = false;
                                if (a) {
                                    a.pause();
                                }
                            } else {
                                console.log("Played");
                                settings.playing = true;
                                if (a) {
                                    a.play();
                                }
                            }

                            const playpause = document.getElementById('playpause');
                            try {
                                const c = playpause.children[0];
                                c.textContent = settings.playing ? 'pause' : 'play';
                            } catch (error) {
                                console.log("Probably don't have a child on playpause element yet.");
                            }
                            // console.log(playpause.children[0].textContent);
                        }

                        function nextSong() {
                            if (curSong !== null) {
                                // reminder that order is 1-indexed
                                const nextIndex = curSong.order;
                                if (nextIndex === settings.albumOrder.songs.length) return;
                                launchSong(settings.albumOrder.songs[nextIndex]);
                            }
                        }

                        function prevSong() {
                            if (curSong !== null) {
                                // reminder that order is 1-indexed
                                const prevIndex = curSong.order - 2;
                                if (prevIndex === -1) return;
                                launchSong(settings.albumOrder.songs[prevIndex]);
                            }
                        }


                        // okay, we need to be able to take the above, and get:
                        // 1. Listen to it
                        // 2. Leave notes on it
                        // 3. Go to the location of the file (via drive name --> url)

                        function setHtmlElements() {

                            // Set delete dropdown:
                            const indivSelect = document.getElementById('listen_individual_select');
                            indivSelect.innerHTML = '';

                            // Add a default/placeholder option
                            const defaultOption3 = document.createElement('option');
                            defaultOption3.value = '';
                            defaultOption3.textContent = '-- Select a Version to Listen To --';
                            defaultOption3.disabled = true;
                            defaultOption3.selected = true;
                            indivSelect.appendChild(defaultOption3);

                            let versionsList = getVersionsFromLocalStorage();
                            console.log(versionsList);

                            for (let v of versionsList) {
                                const option = document.createElement('option');
                                option.value = JSON.stringify(v); // Keeping the whole object here
                                option.textContent = v.song_name + ": " + v.version_name;

                                indivSelect.appendChild(option);
                            }



                            const alist = document.getElementById('album_order_list');
                            alist.innerHTML = '';
                            const aorders = getFaunixAlbumOrders();
                            console.log("Getting album orders:");
                            console.log(aorders);
                            for (let ao of aorders) {
                                // console.log(ao);
                                let aoname = ao.album_order_name;
                                let blanknum = ao.songs.reduce((num, s) => {
                                    if (s.version === 'blank') {
                                        num++;
                                    }
                                    return num;
                                }, 0);
                                let fillednum = ao.songs.length - blanknum;

                                const previewstring = `${ao.album_order_name} | (${fillednum} filled, ${blanknum} blank)`;
                                // console.log(previewstring);

                                let button = document.createElement('button');
                                button.textContent = previewstring;
                                button.value = JSON.stringify(ao);
                                button.onclick = () => startAlbumOrder(ao);
                                // console.log(button.value);

                                const li = document.createElement('li');
                                li.class = "songSelect";
                                li.appendChild(button);
                                alist.appendChild(li);
                            }


                        }


                        function stuffWithEventListeners(audio) {

                                const mins = Math.floor(seconds / 60);
                                const secs = Math.floor(seconds % 60);
                                return `${mins}:${secs.toString().padStart(2, '0')}`;
                            }

                            audio.addEventListener('timeupdate', () => {
                                // Fires constantly as song plays - perfect for progress bars!
                                // console.log(formatTime(audio.currentTime));
                            });

                            audio.addEventListener('ended', () => {
                                // Song finished - play next track!
                                if (settings.autoplay) {
                                    nextSong();
                                }
                            });

                            audio.addEventListener('loadedmetadata', () => {
                                // Duration is now available
                                console.log('Song length:', audio.duration);
                            });



                            /*
                            Hell yeah, the <audio> element is packed with useful stuff! Here's what you can grab:
                                Time & Playback

                                javascript

                                audio.seeking          // Boolean - currently seeking?
                                Useful Methods

                                audio.pause()
                                audio.load()           // Reload the audio
                                Practical Example:
                                javascriptconst audio = settings.audioComponent;

                                // Get progress as percentage
                                const progress = (audio.currentTime / audio.duration) * 100;

                                // Jump to 30 seconds in
                                audio.currentTime = 30;

                                // Check if almost done
                                if (audio.duration - audio.currentTime < 10) {
                                    console.log("Less than 10 seconds left!");
                                }

                                // Format time nicely
                                function formatTime(seconds) {
                                    const mins = Math.floor(seconds / 60);
                                    const secs = Math.floor(seconds % 60);
                                    return `${mins}:${secs.toString().padStart(2, '0')}`;
                                }

                                console.log(formatTime(audio.currentTime)); // "2:47"
                                */

                        }




                        // load all the metadata, setup the player.
                        // song is from object {order, name, version}
                        function launchSong(song) {
                            let autoplay = settings.autoplay;
                            curSong = song;

                            console.log(`launching ${song.name} with autoplay setting ${autoplay}`);
                            console.log(song);

                            // so much setting metadata...
                            if (!autoplay) {
                                settings.status = 'paused ' + song.name;
                                settings.playing = false;
                            } else {
                                settings.status = 'playing ' + song.name;
                                settings.playing = true;
                            }

                            settings.version = song.version;

                            syncPlayerWithSettings();

                            // build out the audio component and append it to the html:
                            const player = document.getElementById('player');
                            const embedLink = song.version.s3_url;

                            let audioComponent;
                            try {
                                // build out a functional audio component
                                const audio = document.createElement('audio');
                                audio.src = embedLink;
                                audio.controls = true; // show play/pause controls

                                // Later when you want to play/pause:
                                // audio.play()
                                // audio.pause()

                                audioComponent = audio;
                                settings.audioComponent = audioComponent;

                                /* audioComponent.addEventListener('loadedmetadata', () => {
                                    console.log(`loaded song ${version.song_name}: ${version.version_name}\nfrom ${embedLink}`);
                                    console.log('Duration:', audioComponent.duration);
                                });*/
                                if (!autoplay) {
                                    audioComponent.pause();
                                } else {
                                    audioComponent.play();
                                }


                                stuffWithEventListeners(audio);


                            } catch (error) {
                                // replace with a standard red feedback text
                                audioComponent = document.createElement('h2');
                                audioComponent.style = "color: red";
                                audioComponent.textContent = `Failed to get embed link because ${error.message}`;
                                settings.playing = false;
                                settings.status = 'failed to play';
                                curSong = null;
                            }

                            // append child
                            replaceChild(player, audioComponent);

                        }

                        function startAlbumOrder(albumOrder) {
                            console.log("Launching albumOrder " + albumOrder.album_order_name);
                            console.log(albumOrder);
                            if (!albumOrder.songs || albumOrder.songs.length === 0) {
                                console.log("Blank song list");
                                return;
                            }
                            settings.albumOrder = albumOrder;
                            settings.album_order_name = albumOrder.album_order_name;
                            settings.autoplay = true;
                            settings.playing = false;
                            settings.status = 'paused ' + albumOrder.songs[0].name;

                            launchSong(albumOrder.songs[0])


                            // Need to give the user the controls to switch between different songs.
                            // Start paused, let them click play.
                            // Start the player with the first version. Let them cycle left/right whatever
                        }





                        // <!-- Run on launch: -->
                        // remember state, can be modified to include more/less details
                        let settings = {
                            status: 'not_playing',
                            album_order_name: 'none',
                            albumOrder: 'none',
                            version: getBlankSongVersion(),
                            autoplay: true,
                            playing: false,
                            audioComponent: null, // will be replaced by a reference to the actual component
                        }

                        // would like a decent system for keeping track of the current album order and what's being played
                        let curSong = null;
                        /*

                            }

                        let songInfo = null;
