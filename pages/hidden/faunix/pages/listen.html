                        // NEW: single place that reflects the current play/pause state into
                        // (a) the on-page play/pause button and (b) the OS lock-screen state.
                        // Called by the audio element's native 'play'/'pause' events, so it
                        // stays correct no matter WHERE the pause came from: our button, the
                        // <audio> controls, the lock screen, or headphone buttons.
                        function reflectPlayState() {
                            const playpause = document.getElementById('playpause');
                            try {
                                const c = playpause.children[0];
                                if (c) c.textContent = settings.playing ? 'pause' : 'play';
                            } catch (error) {
                                console.log("Probably don't have a child on playpause element yet.");
                            }
                            if ('mediaSession' in navigator) {
                                navigator.mediaSession.playbackState = settings.playing ? 'playing' : 'paused';
                            }
                        }

                                }
                            } else {
                                console.log("Played");
                                settings.playing = true;
                                if (a) {
                                    a.play();
                                }
                            }

                            // CHANGED: button text is now handled by reflectPlayState (fired via the
                            // audio element's native events), but we call it here too so a click with
                            // no audio element yet still updates immediately.
                            reflectPlayState();
                            // console.log(playpause.children[0].textContent);
                        }

                            }
                        }

                        function formatTime(seconds) {
                            const mins = Math.floor(seconds / 60);
                            const secs = Math.floor(seconds % 60);
                            return `${mins}:${secs.toString().padStart(2, '0')}`;
                        }


                        // CHANGED: this now runs ONCE (from getOrCreateAudio), not per-song.
                        // The 'ended' handler is debounced, and we added native 'play'/'pause'
                        // listeners so the UI + lock screen stay in sync with the real element.
                        function stuffWithEventListeners(audio) {

                            audio.addEventListener('timeupdate', () => {
                                // Fires constantly as song plays - perfect for progress bars!
                                // console.log(formatTime(audio.currentTime));

                                try {
                                    curtime = formatTime(audio.currentTime);
                                    if (notesButton) {

                                        const notesList = document.getElementById('notesList');
                                        const childCount = notesList.children.length;

                                        if (childCount > 0) {
                                            notesButton.textContent = `Leave additional note at ${curtime}`;
                                        } else {
                                            notesButton.textContent = `Leave note at ${curtime}`;
                                        }


                                        notesButton.onclick = () => leaveNote(curSong, audio.currentTime, settings.albumOrder);
                                    }
                                } catch (error) {
                                    console.log("Error with notesButton ");
                                    console.log(error);
                                }
                            });

                            // CHANGED: debounced 'ended'.
                            // iOS throttles JS while the screen is locked and QUEUES the 'ended'
                            // event, sometimes delivering a stale duplicate when you reopen the
                            // page -> that was the "it skipped a song" bug. We advance at most
                            // once per ~1.5s. (settings.lastAdvance is also stamped in launchSong,
                            // so a stale 'ended' right after a manual skip is ignored too.)
                            audio.addEventListener('ended', () => {
                                if (!settings.autoplay) return;

                                const now = Date.now();
                                if (now - (settings.lastAdvance || 0) < 1500) {
                                    console.log("Ignoring duplicate 'ended' (debounced).");
                                    return;
                                }
                                settings.lastAdvance = now;
                                nextSong();
                            });

                            // NEW: keep our state honest no matter who paused/played the audio
                            // (our button, the <audio> controls, or the lock-screen buttons).
                            audio.addEventListener('play', () => {
                                settings.playing = true;
                                reflectPlayState();
                            });
                            audio.addEventListener('pause', () => {
                                settings.playing = false;
                                reflectPlayState();
                            });

                            audio.addEventListener('loadedmetadata', () => {
                                // Duration is now available
                                console.log('Song length:', audio.duration);
                            });



                            /*
                            Hell yeah, the <audio> element is packed with useful stuff! Here's what you can grab:
                                Time & Playback
                                javascript
                                audio.duration         // Total length in seconds (e.g., 245.5)
                                audio.currentTime      // Current position in seconds (e.g., 67.3)
                                audio.paused           // Boolean - is it paused?
                                audio.ended            // Boolean - has it finished?
                                audio.playbackRate     // Playback speed (1.0 = normal, 2.0 = 2x speed)
                                Volume & Audio
                                javascript
                                audio.volume           // 0.0 to 1.0
                                audio.muted            // Boolean - is it muted?
                                Loading State
                                javascriptaudio.readyState       // 0-4, how much has loaded
                                audio.buffered         // TimeRanges object of buffered portions
                                audio.seeking          // Boolean - currently seeking?
                                Useful Methods
                                javascriptaudio.play()           // Returns a Promise!
                                audio.pause()
                                audio.load()           // Reload the audio
                                Practical Example:
                                javascriptconst audio = settings.audioComponent;

                                // Get progress as percentage
                                const progress = (audio.currentTime / audio.duration) * 100;

                                // Jump to 30 seconds in
                                audio.currentTime = 30;

                                // Check if almost done
                                if (audio.duration - audio.currentTime < 10) {
                                    console.log("Less than 10 seconds left!");
                                }

                                // Format time nicely
                                function formatTime(seconds) {
                                    const mins = Math.floor(seconds / 60);
                                    const secs = Math.floor(seconds % 60);
                                    return `${mins}:${secs.toString().padStart(2, '0')}`;
                                }

                                console.log(formatTime(audio.currentTime)); // "2:47"
                                */

                        }


                        // NEW: create the ONE <audio> element and reuse it for the whole album.
                        // The original code built a brand-new <audio> in every launchSong(). On
                        // iOS, only an element whose playback was started by a real tap keeps its
                        // background "audio session." A fresh element created while the phone is
                        // locked has no session, so it silently refuses to start the next song --
                        // that was the core reason autoplay died on a locked screen. By reusing
                        // the element that the first "Start album order" tap unlocked, the session
                        // survives across the whole album, so end-of-song advances keep working
                        // even with the screen off.
                        function getOrCreateAudio() {
                            if (settings.audioComponent) return settings.audioComponent;

                            const audio = document.createElement('audio');
                            audio.controls = true; // show play/pause controls

                            // Fallback if a source fails, guarded so it can't loop on itself.
                            audio.addEventListener('error', () => {
                                if (!audio.src || audio.src.indexOf('womp.m4a') !== -1) return;
                                console.error("Audio failed to load:", audio.src);
                                audio.src = '/pages/hidden/faunix/audios/womp.m4a';
                                audio.load(); // Important! Forces reload with new src
                                audio.play().catch(err => console.log('Even the womp womp failed!'));
                            }, true);

                            // Attach the persistent listeners EXACTLY ONCE.
                            stuffWithEventListeners(audio);

                            settings.audioComponent = audio;
                            return audio;
                        }


                        // NEW: tell the OS what's playing so the lock-screen controls drive our
                        // own next/prev/play/pause. This is also why the metadata on the lock
                        // screen shows the right song/version.
                        function updateMediaSession(song) {
                            if (!('mediaSession' in navigator)) return;
                            try {
                                navigator.mediaSession.metadata = new MediaMetadata({
                                    title: song.version.song_name || song.name || 'Unknown',
                                    artist: song.version.version_name || '',
                                    album: settings.album_order_name || 'Faunix'
                                    // artwork: [{ src: '/pages/hidden/faunix/imgs/logo.png',
                                    //             sizes: '512x512', type: 'image/png' }]
                                });

                                navigator.mediaSession.setActionHandler('play', () => {
                                    if (settings.audioComponent) settings.audioComponent.play();
                                    // settings.playing + button handled by the native 'play' event
                                });
                                navigator.mediaSession.setActionHandler('pause', () => {
                                    if (settings.audioComponent) settings.audioComponent.pause();
                                    // settings.playing + button handled by the native 'pause' event
                                });
                                navigator.mediaSession.setActionHandler('nexttrack', nextSong);
                                navigator.mediaSession.setActionHandler('previoustrack', prevSong);
                            } catch (e) {
                                console.log('Media Session not fully supported:', e);
                            }
                        }


                        // load all the metadata, setup the player.
                        // song is from object {order, name, version}
                        // CHANGED: reuses the single persistent <audio> element (see getOrCreateAudio)
                        // instead of creating a new one each time, and updates the OS media session.
                        function launchSong(song) {
                            let autoplay = settings.autoplay;
                            curSong = song;

                            console.log(`launching ${song.name} with autoplay setting ${autoplay}`);
                            console.log(song);

                            // so much setting metadata...
                            if (!autoplay) {
                                settings.status = 'paused ' + song.name;
                                settings.playing = false;
                            } else {
                                settings.status = 'playing ' + song.name;
                                settings.playing = true;
                            }

                            settings.version = song.version;

                            syncPlayerWithSettings();

                            // build out the audio component and append it to the html:
                            const player = document.getElementById('player');
                            const embedLink = song.version.s3_url;

                            try {
                                // CHANGED: grab the ONE reusable element instead of making a new one.
                                const audio = getOrCreateAudio();

                                // Make sure it's mounted in the player <li> (only actually moves it once).
                                if (audio.parentElement !== player) {
                                    replaceChild(player, audio);
                                }

                                // Stamp the transition time so a stale, queued 'ended' from the
                                // song we just left can't immediately trigger another skip.
                                settings.lastAdvance = Date.now();

                                audio.src = embedLink;
                                audio.load(); // Important! Forces reload with the new src

                                if (!autoplay) {
                                    audio.pause();
                                } else {
                                    // play() returns a Promise; swallow the rejection if the browser
                                    // blocks it (e.g. first load outside a user gesture).
                                    audio.play().catch(err => console.log('play() blocked:', err));
                                }

                                updateMediaSession(song);

                            } catch (error) {
                                // replace with a standard red feedback text
                                console.log("Catching failed launchSong here (1): ");
                                console.log(error);
                                const fail = document.createElement('h2');
                                fail.style = "color: red";
                                fail.textContent = `Failed to get embed link because ${error.message}`;
                                settings.playing = false;
                                settings.status = 'failed to play';
                                curSong = null;
                                replaceChild(player, fail);
                            }
                        }

                        function startAlbumOrder(albumOrder) {
                            console.log("Launching albumOrder " + albumOrder.album_order_name);
                            console.log(albumOrder);
                            if (!albumOrder.songs || albumOrder.songs.length === 0) {
                                console.log("Blank song list");
                                return;
                            }
                            settings.albumOrder = albumOrder;
                            settings.album_order_name = albumOrder.album_order_name;
