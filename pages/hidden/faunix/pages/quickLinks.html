                    <script>


                        function deleteSelectedLink() {
                            const select = document.getElementById('deleteSelect');
                            const value = select.value;
                            console.log(value);
                            deleteLinkFromLocalStorage(value);


                            // Reset the local html elements:
                            setLinkList();
                            setDeleteList();
                        }



                        function deleteLocalStorage() {
                            localStorage.removeItem('faunix_quicklinks_list');
                        }




                        function addLinkToLocalStorage(href, name) {
                            console.log('passing in ' + href);
                            if (!href.startsWith('http://') && !href.startsWith("https://")) {
                                href = "https://" + href;
                            }

                            let links = getLinksFromLocalStorage();
                            links.push({
                                href: href,
                                text: name
                            });

                            localStorage.setItem('faunix_quicklinks_list', JSON.stringify(links));

                            console.log("Here's your links from addLinkToLocalStorage: ");
                            console.log(links);
                        }



                        function setLinkList() {
                            const list = document.getElementById('link_list');
                            list.innerHTML = ''; // clear existing

                            let links = getLinksFromLocalStorage();


                            for (let link of links) {
                                const a = document.createElement('a');
                                a.href = link.href;
                                a.textContent = link.text;
                                a.target = "_blank";

                                const li = document.createElement('li');
                                li.appendChild(a);
                                list.appendChild(li);
                            }


                            console.log("Here's your link list from getLinkList: ");
                            console.log(links);
                            console.log("Here's your list from getLinkList: ");
                            console.log(list);
                        }

                        function setDeleteList() {
                            const select = document.getElementById('deleteSelect');
                            select.innerHTML = ''; // clear existing

                            // Add a default/placeholder option
                            const defaultOption = document.createElement('option');
                            defaultOption.value = '';
                            defaultOption.textContent = '-- Select a link --';
                            defaultOption.disabled = true;
                            defaultOption.selected = true;
                            select.appendChild(defaultOption);


                            let links = getLinksFromLocalStorage();

                            for (let link of links) {
                                const option = document.createElement('option');
                                option.value = link.text;
                                option.textContent = link.text;

                                select.appendChild(option);
                            }

                        }



                        function submitNewLink() {
                            const href = document.getElementById('link_href').value;
                            const name = document.getElementById('link_name').value;
                            const feedback = document.getElementById('addLinkFeedback');
                            feedback.textContent = '';
                            feedback.style = "color: green;";

                            console.log("Submitting new link.");
                            console.log(`href: ${href}`);
                            console.log(`name: ${name})`);

                            if (href == "" || name == "") {
                                console.log(`href: ${href}, name: ${name}`);
                                feedback.textContent = "Blank URL or Name, submission rejected.";
                                feedback.style = "color: red;";
                                return false;
                            }

                            addLinkToLocalStorage(href, name);
                            post('add_quick_link', { href: href, name: name });
                            feedback.textContent = "Link added successfully.";
                            console.log("Link added successfully.");

                            setLinkList();
                            setDeleteList();


                            return true;
                        }



                        // <!-- Run on launch: -->
                        setLinkList();
                        setDeleteList();
                    </script>
