                    <script>


                        function deleteSelectedLink() {
                            const select = document.getElementById('deleteSelect');
                            const value = select.value;
                            console.log(value);

                            const versions = getFaunixAlbumOrders();

                            let newAlbumOrders = [];

                            // Create a new list, skipping the value if it matches
                            for (let v of versions) {
                                if (v.timestamp === value) { // timestamp is unique key here.
                                    console.log("Deleting: " + v.album_order_name);
                                    console.log(v);
                                    // post about it (update the sheet)
                                    post('delete_album_order', v); // deceptively, v is the entire album order.
                                } else {
                                    newAlbumOrders.push(v);
                                }
                            }

                            // Reset the local list without it:
                            localStorage.setItem('faunix_album_orders', JSON.stringify(newAlbumOrders));


                            // Reset the local html elements:
                            setHtmlElements();
                        }


                        /*
                        // ALBUM_ORDERS:
                            timestamp
                            album_order_name
                            songs: [{
                                name
                                version
                            }]
                            uploader
                            uploader_id: userID
                            
                        */



                        function setHtmlElements() {

                            // Set delete dropdown:
                            const deleteSelect = document.getElementById('deleteSelect');
                            deleteSelect.innerHTML = '';

                            // Add a default/placeholder option
                            const defaultOption3 = document.createElement('option');
                            defaultOption3.value = '';
                            defaultOption3.textContent = '-- Select an Album Order to Delete --';
                            defaultOption3.disabled = true;
                            defaultOption3.selected = true;
                            deleteSelect.appendChild(defaultOption3);

                            let versionsList = getFaunixAlbumOrders();

                            for (let v of versionsList) {
                                const option = document.createElement('option');
                                option.value = v.timestamp; // using timestamp as key here
                                option.textContent = v.album_order_name;

                                deleteSelect.appendChild(option);
                            }


                        }






                        // <!-- Run on launch: -->
                        // setLinkList();
