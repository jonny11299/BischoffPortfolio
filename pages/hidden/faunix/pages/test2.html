          <script>

            // Calculates the fastest path to bowl to this score
            function bowlTo(target, history = []) {
              if (target > 300) {
                return "Not possible.";
              }

              // const lastScore = history == [] ? 0 : history[-1];
              let lastScore = 0;
              if (history != []) {
                for (let n of history) {
                  lastScore += n;
                }
              }

              console.log(lastScore);

              if (target - lastScore < 11) {
                history.push(target - lastScore);
                return history;
              } else {
                history.push(10);
                return bowlTo(target, history);
              }
            }

            function calculate() {
              const input = document.getElementById('numberInput').value;
              const number = parseFloat(input);

              const result = bowlTo(input);
              let numFrames = result.length;
              if (typeof result == Array) {
              }

              document.getElementById('result').textContent = `Number of rounds: ${numFrames}\nFrames: ${result}`;
            }
          </script>
