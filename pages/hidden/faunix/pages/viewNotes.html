<body data-page="home">
    <!-- NAV sits at the top  (or at least... it USED to)
  <div data-include="/pages/hidden/faunix/partials/nav.html"></div>-->

    <!-- Main centered content -->
    <div class="page-wrapper">
        <div class="scaled-content">

            <main class="container">
                <section class="section">

                    <!--
          <div style="display:inline-block; margin-bottom:0px; padding:0; border:0;">
            <img src="/pages/hidden/faunix/imgs/logo.png" alt="Some logo"
              style="display:block; margin:0; margin-bottom:2px; padding:0; padding-bottom:2px; border:0; color: #ffffff;">

                    <header>
                        <p></p>
                        <h1>Notes:</h1>
                    </header>

                    <!-- Add "Submit new links:"-->
                    <ul>
                        <li id='ledgerlistparent'>
                            <h3 style="color: yellow">Ledger loading...</h3>
                        </li>
                    </ul>

                    <script>

                        function getMyNotes() {
                            console.log("Getting notes...");
                            const notesPromise = get('get_song_notes');
                            notesPromise.then((result) => {
                                console.log("Got notes:");
                                console.log(result);
                            });
                        }
                        getMyNotes();

                        function updateLedgerList(ll) {


                            try {
                                const parent = document.getElementById('ledgerlistparent');
                                parent.innerHTML = '';
                                parent.style = "font-size: 11px; color: white";

                                const headers = ll[0];
                                const body = ll.slice(1);


                                // old school reversing an array
                                for (let i = 0; i < body.length / 2; i++) {
                                    let temp = body[i];
                                    body[i] = body[body.length - i - 1];
                                    body[body.length - i - 1] = temp;
                                }


                                const table = document.createElement('table');
                                const thead = table.createTHead();
                                const tbody = table.createTBody();

                                const headerRow = thead.insertRow();
                                headers.forEach(e => {
                                    const th = document.createElement('th');
                                    th.textContent = `${e}`;
                                    headerRow.appendChild(th);
                                });

                                body.forEach(bod => {
                                    const row = tbody.insertRow();
                                    bod.forEach(cell => {
                                        const c = row.insertCell();
                                        c.textContent = cell.slice(0, 100);
                                    })
                                });

                                parent.appendChild(table);

                            } catch (error) {
                                console.error("Error on updateLedgerList");
                                console.error(error);
                            }
                        }

                        function getledgerlist() {
                            const getPromise = get('get_ledger_list').then(response => {
                                console.log("Got the ledger list: ");
                                console.log(response);
                                updateLedgerList(response);
                            })
                        }
                        // getledgerlist();
                    </script>



                </section>
            </main>
        </div>
    </div>

    <!-- Footer sits at the bottom -->
