          <script>




            function escapeOverwrittenLogging() {
              console.log("You've escaped overwritten logging. Reload to see.");
              localStorage.setItem('faunix_escapeOverwrittenLogging', 'true');
              localStorage.removeItem('faunix_lastpagelogs');
            }
            function returnToOverwrittenLogging() {
              console.log("You've returned to overwritten logging. Reload to see.");
              localStorage.removeItem('faunix_escapeOverwrittenLogging');
            }


            function checkStorageSize() {
              // Get total size in bytes
              const totalSize = new Blob(Object.values(localStorage)).size;
              console.log(`Total: ${totalSize} bytes (${(totalSize / 1024).toFixed(2)} KB)`);

              // See each item's size
              Object.keys(localStorage).forEach(key => {
                const size = new Blob([localStorage.getItem(key)]).size;
                console.log(`${key}: ${size} bytes (${(size / 1024).toFixed(2)} KB)`);
              });
            }

            function setQuickLinks() {
              const list = document.getElementById('link_list');
              list.innerHTML = ''; // clear existing

              let links = getLinksFromLocalStorage();


              for (let link of links) {
                const a = document.createElement('a');
                a.href = link.href;
                a.textContent = link.text;
                a.target = "_blank";

                const li = document.createElement('li');
                li.appendChild(a);
                list.appendChild(li);
              }


              console.log("Here's your link list from getLinkList: ");
              console.log(links);
              console.log("Here's your list from getLinkList: ");
              console.log(list);
            }




            function setHtmlElements() {
              document.getElementById('version_name').value = '';
              document.getElementById('embed_link').value = '';

              const songSelect = document.getElementById('songSelect');
              songSelect.innerHTML = ''; // clear existing

              // Add a default/placeholder option
              const defaultOption1 = document.createElement('option');
              defaultOption1.value = '';
              defaultOption1.textContent = '-- Select a song --';
              defaultOption1.disabled = true;
              defaultOption1.selected = true;
              songSelect.appendChild(defaultOption1);


              let songs = getSongNames();
              // console.log("Songs:");
              // console.log(songs);

              for (let song of songs) {
                const option = document.createElement('option');
                option.value = song;
                option.textContent = song;

                songSelect.appendChild(option);
              }


              // Set quick links:
              const quickLinkSelect = document.getElementById('quickLinkSelect');
              quickLinkSelect.innerHTML = '';

              // Add a default/placeholder option
              const defaultOption2 = document.createElement('option');
              defaultOption2.value = '';
              defaultOption2.textContent = '-- Select a Source --';
              defaultOption2.disabled = true;
              defaultOption2.selected = true;
              quickLinkSelect.appendChild(defaultOption2);

              let quickLinks = getLinksFromLocalStorage();
              for (let link of quickLinks) {
                const option = document.createElement('option');
                option.value = link.text;
                option.textContent = link.text;

                quickLinkSelect.appendChild(option);
              }


              const versionsList = getVersionsFromLocalStorage();



            }


            function addSongToLocalStorage(version) {

              let songs = getVersionsFromLocalStorage();

              songs.push({
                timestamp: version.timestamp,
                song_name: version.song_name,
                version_name: version.version_name,
                uploader: version.uploader,
                uploader_id: version.uploader_id,
                drive_name: version.drive_name,
                s3_url: version.s3_url
              })

              localStorage.setItem('faunix_song_versions', JSON.stringify(songs));

              console.log("Here's your song versions: ");
              console.log(songs);
            }





            function submitNewSongVersionTest() {

              const songName = document.getElementById('songSelect').value;
              const versionName = document.getElementById('version_name').value;
              const quickLinkName = document.getElementById('quickLinkSelect').value;
              const embed_link = document.getElementById('embed_link').value;
              const timestamp = new Date(Date.now()).toISOString();
              const username = getName();
              const userID = getUserID();


              let fail = "";
              if (songName == "") {
                fail = "Blank song name ";
              }
              if (versionName == "") {
                fail += "Blank version name ";
              }
              if (quickLinkName == "") {
                fail += "Blank quickLink name ";
              }
              if (embed_link == "") {
                fail += "Blank embed link ";
              }
              console.log(fail);

              let feedback = document.getElementById("addSongFeedback");
              if (!(fail === "")) {
                fail += "; Submission rejected."
                feedback.textContent = fail;
                feedback.style = "color: red;";
                console.log("Failing because " + fail);
                return false;
              }

              feedback.textContent = "Submission Successful.";
              feedback.style = "color: green";


              const submission = {
                timestamp: timestamp,
                song_name: songName,
                version_name: versionName,
                uploader: username,
                uploader_id: userID,
                drive_name: quickLinkName,
                s3_url: embed_link
              }

              console.log("Submitting new song to local storage:");
              console.log(submission);

              addSongToLocalStorage(submission);


              setHtmlElements();
            }


            setHtmlElements();


          </script>
