            // Setting up localStorage:

            const lsname = 'copypast_bischoff_ls';

            function getItemsLS() {
                const itemsList = JSON.parse(localStorage.getItem(lsname));
                return itemsList;
            }
            function putItemsLS(fullStructure) {
                const str = JSON.stringify(fullStructure);
                localStorage.setItem(lsname, str);
                putConsole('updated localStorage');
            }




            function appendSVG(liElement, svgPath, w = "2rem") {
                const img = document.createElement('img');

                try {
                    img.src = svgPath;
                    img.alt = `${liElement.id}`; // sets the alternative if it can't find the path
                    img.style = `width: ${w}`;
                    liElement.innerHTML = '';
                    liElement.appendChild(img);
                    console.log(liElement);

                } catch (error) {
                    console.error("Error appending SVG:");
                    console.error(liElement);
                    console.error(error);
                }
            }

            setTimeout(() => {

                // add the icons 
                console.log("Appending icons");
                const add = document.getElementById('add');
                const edit = document.getElementById('edit');
                const remove = document.getElementById('remove');

                appendSVG(add, 'icons/add.svg');
                appendSVG(edit, 'icons/edit.svg');
                appendSVG(remove, 'icons/remove.svg');



                // setup the list:

                // input forms:
                // this quick function ensures that they grow and shrink with the inputted text
                document.querySelectorAll('.textAreaForm').forEach(textarea => {
                    textarea.addEventListener('input', function () {
                        this.style.height = 'auto';                          // reset first
                        this.style.height = this.scrollHeight + 'px';       // then expand
                    });
                });


                const check = document.getElementById('check');
                const x = document.getElementById('x');
                appendSVG(check, 'icons/check.svg', "1.5rem");
                appendSVG(x, 'icons/x.svg', "1.5rem");

                // add button functionality:

                add.onclick = () => addNewEntry();
                remove.onclick = () => removeSelectedEntry();

                check.onclick = () => submitNewEntry();
                x.onclick = () => cancelNewEntry();

                updateColumns();
                hideNewEntry();

            }, 50);


            // setting up the item logic in general

            const item = {
                name: "blank",
                body: "blank body",
                active: false
            };

            const items = getItemsLS();
            /*
            items.push(item);
            items.push({

            items.push({

            function hideNewEntry() {
                // console.log("hideNewEntry run");
                document.querySelectorAll('.newEntryForm').forEach(item => {
                    item.style.display = "none"
                });

            }
            function showNewEntry() {
                // console.log("showNewEntry run");
                document.querySelectorAll('.newEntryForm').forEach(item => {
                    // console.log(item);
                    item.style.display = "block"
                });
            }



            function addNewEntry() {
                // console.log("Running addNewEntry");
                showNewEntry();
            }

            function removeSelectedEntry() {
                const active = getActiveItem();
                if (active) {
                    const inp = prompt('Are you sure you want to remove the selected entry?\nEntry is:\n' + active.name + '\nType "yes" to continue.');

                    if (inp.toLowerCase() === 'yes') {
                        console.log('removing' + active.name);
                        putConsole('removing' + active.name);
                    } else {
                        console.log('cancelled removal of' + active.name);
                        putConsole('cancelled removal of' + active.name)
                    }

                }
            }


            function submitNewEntry() {
                const name = document.getElementById('nameEntry').value;
                const body = document.getElementById('bodyEntry').value;
                const newItem = {
                    name: name,
                    body: body,
                    active: false
                };
                console.log(newItem);
                items.push(newItem);


                putItemsLS(items);

                // for some reason this doesn't ERASE THE EXISTING TEXT
                name.value = '';
                body.value = '';

                hideNewEntry();
                updateColumns();
            }

            function cancelNewEntry() {

                hideNewEntry();
                updateColumns();
            }

            function copyToClipboard(text) {
                navigator.clipboard.writeText(text);
            }

            function putBodyPreview(text) {
                const bodyPreview = document.getElementById('bodyPreview');
                bodyPreview.textContent = text;
            }

            function setActive(p) {
                let nameContent = '';
                for (let item of items) {
                    if (p.textContent === item.name) {
                        // console.log("active " + item.name);
                        // p.parentElement.classList.add('selected');
                        item.active = true;
                        nameContent = item.name;
                    } else {
                        // console.log("deactivate " + item.name);
                        // p.parentElement.classList.remove('selected');
                        item.active = false;
                    }
                }


                const els = document.getElementById('namecol');

                for (let child of els.children) {
                    const c = child.children[0];
                    if (c.innerText === nameContent) {
                        c.parentElement.classList.add('selected');
                    } else {
                        c.parentElement.classList.remove('selected');
                    }
                }



                console.log(items);
            }

            function getActiveItem() {
                for (let item of items) {
                    if (item.active) return item;
                }
                return undefined;
            }

            function getActiveElement() {
                const els = document.getElementById('namecol');
                // console.log(els);
                let activeItem = getActiveItem();

                for (let child of els.children) {
                    const c = child.children[0];
                    if (c.innerText === activeItem.name) return c;
                }


            }

            function updateColumns() {
                const namecol = document.getElementById('namecol');
                namecol.innerHTML = '';
                // const bodycol = document.getElementById('bodycol');
                // bodycol.innerHTML = '';


                items.forEach((item) => {
                    const p = document.createElement('p');
                    p.textContent = item.name;
                    const lin = document.createElement('li');
                    lin.appendChild(p);
                    namecol.appendChild(lin);
                    lin.className = 'nameItemClass';
                    lin.addEventListener('click', () => {
                        // console.log("clicked on name");

                        copyToClipboard(item.body);
                        replaceConsole(`copied: ${item.body}`);
                        putBodyPreview(item.body);
                        setActive(p);
                        // const ac = getActiveElement();
                        // console.log(ac);
                    });


                });
            }
