            // all that work setting up a server, reflected in the bottom functions.
            // they use the imports in the head.

            async function postCopyPasteBlob(blob) {
                putConsole('posting ls to blob');
                post_blob(getLocation('copypaste_body'), blob, (successResponse) => {
                    putConsole("Succeeded posting blob.");
                }, (failResponse) => {
                    putConsole("Failed to post blob.");
                });
            }

            async function getCopyPasteBlob() {
                const blob = await get_blob(getLocation('copypaste_body'));
                return JSON.parse(blob);
            }

            async function logCopyPasteBlob() {
                const res = await getCopyPasteBlob();
                console.log(res);
            }


            function putConsole(text) {
                const con = document.getElementById('myConsole');
                con.innerText = con.innerText + '\n' + text;
            }
            function eraseConsole() {
                const con = document.getElementById('myConsole');
                con.innerText = '';
            }
            function replaceConsole(text) {
                eraseConsole();
                putConsole(text);
            }


            function moveLStoBlob() {
                const ls = getItemsLS();
                postCopyPasteBlob(ls);
            }
            async function replaceLSwithBlob() {

                if (inp.toLowerCase() === 'yes') {
                    putConsole("Replacing localStorage with blob data.");
                    const blob = await getCopyPasteBlob();
                    console.log(blob);
                    putItemsLS(blob);
                    putConsole("Successfully got blob.");
                    updateColumns();

                } else {
                    putConsole('halted replacement of localStorage with blob data.')
                }
            }

            // Setting up localStorage:

            const lsname = 'copypast_bischoff_ls';

            function getItemsLS() {
                const itemsList = JSON.parse(localStorage.getItem(lsname)).sort((a, b) => a.name.localeCompare(b.name));

                // items = items.sort((a, b) => a.name.localeCompare(b.name));
                // console.log(itemsList);
                /* itemsList.sort((a, b) => {
                    if (a.name <= b.name) return -1;
                    else return 1;
                });*/
                if (!Array.isArray(itemsList)) {
                    return [];
                }
                return itemsList;
            }
            function putItemsLS(fullStructure) {
                const str = JSON.stringify(fullStructure);
                localStorage.setItem(lsname, str);
                putConsole('updated localStorage');
            }

            function removeItemLS(itemToRemove) {
                items = getItemsLS();
                newItems = [];
                for (let item of items) {
                    if (itemToRemove.name === item.name && itemToRemove.body === item.body) {
                        // skip
                        console.log("found itemToRemove, ");
                        console.log(itemToRemove);
                    } else {
                        newItems.push(item);
                    }
                }
                putItemsLS(newItems);
                updateColumns();
            }




            function appendSVG(liElement, svgPath, w = "2rem") {
                const img = document.createElement('img');

                try {
                    img.src = svgPath;
                    img.alt = `${liElement.id}`; // sets the alternative if it can't find the path
                    img.style = `width: ${w}`;
                    liElement.innerHTML = '';
                    liElement.appendChild(img);
                    // console.log(liElement);

                } catch (error) {
                    console.error("Error appending SVG:");
                    console.error(liElement);
                    console.error(error);
                }
            }


            let linkToggle = false;

            // runs on launch
            setTimeout(() => {

                // add the icons 
                // console.log("Appending icons");
                const add = document.getElementById('add');
                const edit = document.getElementById('edit');
                const remove = document.getElementById('remove');

                appendSVG(add, 'icons/add.svg');
                appendSVG(edit, 'icons/edit.svg');
                appendSVG(remove, 'icons/remove.svg');



                // setup the list:

                // input forms:
                // this quick function ensures that they grow and shrink with the inputted text
                document.querySelectorAll('.textAreaForm').forEach(textarea => {
                    textarea.addEventListener('input', function () {
                        this.style.height = 'auto';                          // reset first
                        this.style.height = this.scrollHeight + 'px';       // then expand
                    });
                });


                const check = document.getElementById('check');
                const isLink = document.getElementById('isLink');
                const x = document.getElementById('x');
                appendSVG(check, 'icons/check.svg', "1.5rem");
                appendSVG(x, 'icons/x.svg', "1.5rem");
                appendSVG(isLink, 'icons/link.svg', "1.5rem");

                // add button functionality:

                add.onclick = () => addNewEntry();
                remove.onclick = () => removeSelectedEntry();
                edit.onclick = () => editSelectedEntry();

                check.onclick = () => submitNewEntry();
                isLink.onclick = () => toggleIsLink();
                x.onclick = () => cancelNewEntry();

                // set all the items to inactive
                deactivateAllItems();
                updateColumns();
                hideNewEntry();

            }, 50);


            // setting up the item logic in general

            const item = {
                name: "blank",
                body: "blank body",
                active: false
            };

            let items = getItemsLS();

            /*
            items.push(item);
            items.push({
                name: 'blank2',
                body: 'more real body',
                active: false
            });
            items.push({

            // putConsole(JSON.stringify(item));
            // eraseConsole();

            function hideNewEntry() {
                // console.log("hideNewEntry run");
                document.querySelectorAll('.newEntryForm').forEach(item => {
                    item.style.display = "none"
                });

            }
            function showNewEntry() {
                // console.log("showNewEntry run");
                document.querySelectorAll('.newEntryForm').forEach(item => {
                    // console.log(item);
                    item.style.display = "block"
                });
            }


            let addingNewEntry = false;
            let editingExistingEntry = false;

            function addNewEntry() {
                // console.log("Running addNewEntry");
                addingNewEntry = true;
                editingExistingEntry = false;
                showNewEntry();
            }

            function removeSelectedEntry() {
                const active = getActiveItem();
                if (active) {
                    const inp = prompt('Are you sure you want to remove the selected entry?\nEntry is:\n' + active.name + '\nType "yes" to continue.');

                    if (inp.toLowerCase() === 'yes') {
                        console.log('removing' + active.name);
                        putConsole('removing' + active.name);
                        removeItemLS(active);
                    } else {
                        console.log('cancelled removal of' + active.name);
                        putConsole('cancelled removal of' + active.name)
                    }

                }
            }

            function editSelectedEntry() {
                addingNewEntry = false;
                editingExistingEntry = true;

                const active = getActiveItem();
                if (active) {
                    // show the new entry, but first set newEntry to whatever the selected entry is
                    const tan = document.getElementById('nameEntry');
                    const tab = document.getElementById('bodyEntry');

                    tan.value = active.name;
                    tab.value = active.body;

                    showNewEntry();
                }
            }

            function toggleIsLink() {
                linkToggle = !linkToggle;

                const isLink = document.getElementById('isLink');
                if (linkToggle) {
                    isLink.classList.add('toggled');
                } else {
                    isLink.classList.remove('toggled');
                }
            }


            function submitNewEntry() {
                // if we're editing an existing entry, we need to delete the selected one
                let setNewItemToActive = false;
                if (editingExistingEntry) {
                    removeItemLS(getActiveItem());
                    // need to set the element 'bodyPreview' to be whatever's in bodyEntry
                    // in order to stomp this interesting bug where it still shows whatever the 
                    // pre-edited version of the body was
                    document.getElementById('bodyPreview').textContent = document.getElementById('bodyEntry').value;
                    setNewItemToActive = true;
                }


                const nameEntry = document.getElementById('nameEntry');
                const bodyEntry = document.getElementById('bodyEntry');
                const newItem = {
                    name: nameEntry.value,
                    body: bodyEntry.value,
                    isLink: linkToggle,
                    active: setNewItemToActive
                };
                console.log(newItem);
                items.push(newItem);


                putItemsLS(items);

                nameEntry.value = '';
                bodyEntry.value = '';

                hideNewEntry();
                updateColumns();


                editingExistingEntry = false;
                addingNewEntry = false;
                linkToggle = false;
            }

            function cancelNewEntry() {

                const nameEntry = document.getElementById('nameEntry');
                const bodyEntry = document.getElementById('bodyEntry');
                nameEntry.value = '';
                bodyEntry.value = '';

                hideNewEntry();
                updateColumns();
            }

            function copyToClipboard(text) {
                navigator.clipboard.writeText(text);
            }

            function openLink(text) {
                // pressing meta down will stop the link opening functionality
                if (!metaDown) {
                    const a = document.createElement("a");
                    a.href = `${text}`;
                    a.target = "_blank";
                    a.click();

                }
            }

            function putBodyPreview(text) {
                const bodyPreview = document.getElementById('bodyPreview');
                bodyPreview.textContent = text;
            }


            function deactivateAllItems() {
                console.log("Deactivating all items");
                for (let item of items) {
                    item.active = false;
                }
                putItemsLS(items);
            }


            function setActive(p) {
                let nameContent = '';
                for (let item of items) {
                    if (p.textContent === item.name) {
                        // console.log("active " + item.name);
                        // p.parentElement.classList.add('selected');
                        item.active = true;
                        nameContent = item.name;
                    } else {
                        // console.log("deactivate " + item.name);
                        // p.parentElement.classList.remove('selected');
                        item.active = false;
                    }
                }


                const els = document.getElementById('namecol');

                for (let child of els.children) {
                    const c = child.children[0];
                    if (c.innerText === nameContent) {
                        c.parentElement.classList.add('selected');
                    } else {
                        c.parentElement.classList.remove('selected');
                    }
                }

                console.log(items);
            }

            function getActiveItem() {
                for (let item of items) {
                    if (item.active) return item;
                }
                return undefined;
            }

            function getActiveElement() {
                const els = document.getElementById('namecol');
                // console.log(els);
                let activeItem = getActiveItem();

                for (let child of els.children) {
                    const c = child.children[0];
                    if (c.innerText === activeItem.name) return c;
                }


            }


            let metaDown = false;
            document.addEventListener('keydown', (e) => {
                // console.log("Keydown");
                // console.log(e);
                if (e.key === "Meta") {
                    console.log("Meta down");
                    metaDown = true;
                }
            });
            document.addEventListener('keyup', (e) => {
                // console.log("Keyup");
                // console.log(e);
                if (e.key === "Meta") {
                    console.log("Meta up");
                    metaDown = false;
                }
            });

            function updateColumns() {
                items = getItemsLS();
                // console.log(items);

                const namecol = document.getElementById('namecol');
                namecol.innerHTML = '';
                // const bodycol = document.getElementById('bodycol');
                // bodycol.innerHTML = '';


                items.forEach((item) => {
                    const p = document.createElement('p');
                    p.textContent = item.name;
                    const lin = document.createElement('li');
                    lin.appendChild(p);
                    namecol.appendChild(lin);
                    lin.className = 'nameItemClass';
                    if (item.isLink) lin.className = 'linkItemClass';
                    lin.addEventListener('click', () => {
                        // console.log("clicked on name");

                        if (!item.isLink) {
                            copyToClipboard(item.body);
                            replaceConsole(`copied: ${item.name}`);
                            putBodyPreview(item.body);
                            setActive(p);
                            // const ac = getActiveElement();
                            // console.log(ac);

                        } else {
                            // add link functionality instead of copied
                            openLink(item.body);
                            replaceConsole(`opened link: ${item.name}`);
                            putBodyPreview(item.body);
                            setActive(p);

                        }
                    });

                    if (item.active) setActive(p);

                });
            }


        </script>
